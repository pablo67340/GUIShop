            - '&8━━━━━━━━━━━━━━━━━'
            - '&e▶ Click to browse!'
          target-shop: 'Combat'
          
        '14':
          id: TNT
          name: '&c&lRaiding'
          lore:
            - '&8━━━━━━━━━━━━━━━━━'
            - '&7TNT, dispensers, and more'
            - '&7Everything you need to raid'
            - '&8━━━━━━━━━━━━━━━━━'
            - '&e▶ Click to browse!'
          target-shop: 'Raiding'
          
        '15':
          id: SPAWNER
          name: '&5&lSpawners'
          lore:
            - '&8━━━━━━━━━━━━━━━━━'
