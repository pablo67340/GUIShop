name: GUIShop
main: com.pablo67340.guishop.GUIShop
version: ${project.version}
author: pablo67340
description: Shop plugin for any server.
depend: [ Vault ]
softdepend: [ PlaceholderAPI, packetevents ]
api-version: 1.13

permissions:
  guishop.use:
    default: op
    description: Grants access to GUIShop
  guishop.shop.*:
    default: op
    description: Grants access to specific items in shop
  guishop.reload:
    default: op
    description: Grants access to reload shops
  guishop.creator:
    default: op
    description: Grants access to the GUIShop creator
  guishop.value:
    default: true
    description: Grants access to the /value command to check item worth
  guishop.sell:
    default: true
    description: Grants access to the sell command
  guishop.economy.balance:
    default: true
    description: Grants access to /bal command
  guishop.economy.balance.others:
    default: op
    description: Allows checking other players' balances
  guishop.economy.pay:
    default: true
    description: Grants access to /pay command

commands:
  guishop:
    description: Base GUIShop command. Displays help.
    permission: guishop.use
    aliases: gs
  guishopuser:
    description: GUIShop alias for buy and sell commands.
    permission: guishop.use
  value:
    description: View an Item's Buy or Sell Value.
    permission: guishop.value
    aliases: [val, gvalue]
  bal:
    description: Check your balance (internal economy)
    permission: guishop.economy.balance
    aliases: [balance, money]
  pay:
    description: Send money to another player (internal economy)
    permission: guishop.economy.pay
    aliases: [send]
  togglepay:
    description: Toggle payment notifications on/off
    permission: guishop.economy.pay
    aliases: [paytoggle]