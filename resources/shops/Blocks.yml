###########################################################################
#                         BLOCKS SHOP                                     #
#                                                                         #
# Building materials - wood, stone, glass, and decorative blocks         #
#                                                                         #
# SHOP STRUCTURE:                                                         #
#   title: 'Name'       # Display title at top of inventory (required)   #
#   rows: 6             # Shop-level rows (optional, applies to all pages)#
#   pages:              # Container for all pages                        #
#     Page0:                                                              #
#       rows: 6         # Page-level rows (optional, overrides shop-level)#
#       items:          # Container for items on this page               #
#                                                                         #
# ROWS CONFIG (1-6):                                                      #
#   - Set at SHOP level to apply same size to ALL pages (shorthand)      #
#   - Set at PAGE level to override for specific pages                   #
#   - If neither set, rows auto-calculate based on item count            #
#                                                                         #
# SLOT LIMITS BY ROWS:                                                    #
#   1 row = slots 0-8    |  4 rows = slots 0-35                          #
#   2 rows = slots 0-17  |  5 rows = slots 0-44                          #
#   3 rows = slots 0-26  |  6 rows = slots 0-53                          #
#                                                                         #
# ITEM STRUCTURE:                                                         #
#   'slot':                                                               #
#     type: SHOP        # SHOP, COMMAND, DUMMY, or BLANK                  #
#     id: MATERIAL      # Bukkit material name (see Dictionary folder)   #
#     buy-price: 10.0   # Price to buy (omit for sell-only)              #
#     sell-price: 2.0   # Price to sell (omit for buy-only)              #
#     shop-name: 'Name' # Custom display name in shop (optional)         #
#     enchantments: 'SHARPNESS:5 UNBREAKING:3'  # Space-separated        #
#     lore:             # Custom lore lines (optional)                   #
#       - '&7Description'                                                 #
#                                                                         #
# SLOTS: Use 10-16 (row 2), 19-25 (row 3), 28-34 (row 4) for 7 items/row #
###########################################################################

# Shop title - displayed at top of inventory
title: '&8&lBlocks'

