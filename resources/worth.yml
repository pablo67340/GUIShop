# ===============================================
# GUIShop Worth Display Configuration
# ===============================================
# This feature displays the sell value of items directly in their lore.
# Players can see at a glance what any item is worth without opening the shop.
#
# REQUIRES: PacketEvents to be installed on the server.
# If PacketEvents is not present, this feature will be disabled automatically.
# ===============================================

# Enable or disable the worth display feature
enabled: true

# The format for the worth line added to item lore
# Placeholders:
#   %worth% - The total sell value of the stack (formatted with currency)
#   %worth_single% - The sell value of a single item (formatted with currency)
#   %amount% - The stack size
#   %currency_prefix% - The currency prefix from messages.yml
#   %currency_suffix% - The currency suffix from messages.yml
format: "&7Worth: &a%worth%"

# Where to add the worth line in the lore
# Options: TOP, BOTTOM
position: BOTTOM

# Add a blank line before the worth line for visual separation
add-blank-line: true

# Only show worth if the item has a sell price > 0
# If false, items without a sell price will show "Not sellable" or similar
only-show-sellable: true

# Text to show for items that cannot be sold (only used if only-show-sellable is false)
not-sellable-format: "&7Worth: &cNot sellable"

# Ignore items that already have lore containing these strings (case-insensitive)
# This prevents duplicate worth lines or conflicts with other plugins
ignore-lore-containing:
  - "Worth:"
  - "Sell Value:"

# Blacklist inventory titles where worth should NOT be displayed
# GUIShop's own inventories (Menu, Shop, Sell, Quantity, Value, AltSell) are automatically excluded.
# Add any other inventory titles here (partial matches, case-insensitive)
blacklisted-inventories:
  - "Auction House"
  - "Crate Preview"

# Blacklist item display names - items with names containing these strings will NOT show worth
# Useful for hiding worth on special items like keys, tokens, or custom items from other plugins
# Uses partial matching (case-insensitive) - if the item's display name contains the string, worth is hidden
blacklisted-item-names:
  - "Crate Key"
  - "Vote Token"

# If true, worth will ONLY show in the player's own inventory (not in any container/GUI)
# This is the most restrictive option - worth only shows in your hotbar and inventory
player-inventory-only: false

# If true, items in armor slots (helmet, chestplate, leggings, boots) will NOT show worth
# Useful if you don't want worth cluttering your equipped armor's lore
hide-armor-slots: true

# Debug mode - logs worth calculations to console (useful for troubleshooting)
debug: false

